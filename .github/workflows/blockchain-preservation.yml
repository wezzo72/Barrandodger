
name: Barran Dodger Blockchain Evidence Preservation

'on':
  push:
    branches:
      - main
      - master
    paths-ignore:
      - preservation/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install OpenTimestamps
        run: |
          python -m pip install --upgrade pip
          python -m pip install opentimestamps-client

      - name: Create SHA-256 evidence manifest
        run: |
          mkdir -p preservation

          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          records = []

          for name in sorted(filter(None, files)):
              path = Path(name)

              if name.startswith("preservation/") or not path.is_file():
                  continue

              digest = hashlib.sha256()

              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      digest.update(chunk)

              records.append({
                  "path": name,
                  "sha256": digest.hexdigest()
              })

          now = datetime.now(timezone.utc)
          manifest = {
              "archive": "Barran Dodger",
              "created_utc": now.isoformat(),
              "git_commit": commit,
              "hash_algorithm": "SHA-256",
              "files": records
          }

          filename = (
              "preservation/manifest-"
              + now.strftime("%Y%m%dT%H%M%SZ")
              + "-" + commit[:12] + ".json"
          )

          Path(filename).write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print("Files fingerprinted:", len(records))
          print("Manifest:", filename)
          PY

      - name: Request Bitcoin blockchain timestamp
        run: |
          ots stamp preservation/*.json

      - name: Commit preservation records
        run: |
          git config user.name "Barran Dodger Preservation Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preservation/
          git commit -m "Preserve blockchain evidence manifest" || exit 0
          git push
