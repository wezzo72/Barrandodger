
name: Forensic PDF Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/target_documents.csv"
      - "scripts/pdf_audit.py"
      - "scripts/verify_quotes.py"
      - ".github/workflows/forensic-pdf-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf

      - name: Check audit files
        run: |
          python -m py_compile scripts/pdf_audit.py
          python -m py_compile scripts/verify_quotes.py

      - name: Run PDF inventory
        run: |
          python scripts/pdf_audit.py \
            --manifest docs/target_documents.csv \
            --output audit-results \
            --delay 1

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-pdf-audit-results
          path: audit-results/
          if-no-files-found: warn
          retention-days: 30

